name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install gnome-extensions
        # The packaging tool ships with GNOME Shell itself, so that the package
        # is built the same way here and on a developer machine.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell

      - name: Check that the tag matches metadata.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r '.["version-name"]' src/metadata.json)"

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version-name $version in src/metadata.json" >&2
            exit 1
          fi

      - name: Build the package
        run: ./dist.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shell-extension
          path: dist/*.shell-extension.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.shell-extension.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
